name: Nix Observability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nix-observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: Linux build metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Collect Linux metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          attr='nixosConfigurations.ideapad.config.system.build.toplevel'
          error_file="out/linux-error.log"
          : > "$error_file"

          lock_inputs_json="$(jq -c '
            .nodes[.root].inputs as $inputs
            | reduce ($inputs | to_entries[]) as $entry ({};
                .[$entry.key] = (
                  .nodes[$entry.value].locked // {}
                  | {
                      type,
                      owner,
                      repo,
                      rev,
                      lastModified,
                      narHash
                    }
                )
              )
          ' flake.lock)"

          status="success"
          drv_path=""
          output_path=""
          output_nar_hash=""
          error_text=""

          if drv_path="$(nix eval --raw ".#${attr}.drvPath" 2>>"$error_file")"; then
            if output_path="$(nix build --no-link --print-out-paths ".#${attr}" 2>>"$error_file")"; then
              output_nar_hash="$(nix path-info --json "$output_path" | jq -r '.[0].narHash // empty')"
            else
              status="failed"
            fi
          else
            status="failed"
          fi

          if [[ "$status" != "success" ]]; then
            error_text="$(cat "$error_file")"
          fi

          jq -n \
            --arg target "linux" \
            --arg mode "build" \
            --arg attr "$attr" \
            --arg status "$status" \
            --arg drv_path "$drv_path" \
            --arg output_path "$output_path" \
            --arg output_nar_hash "$output_nar_hash" \
            --arg error_text "$error_text" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson run_number "${GITHUB_RUN_NUMBER}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --argjson lock_inputs "$lock_inputs_json" \
            '{
              target: $target,
              mode: $mode,
              attr: $attr,
              status: $status,
              drv_path: (if $drv_path == "" then null else $drv_path end),
              output_path: (if $output_path == "" then null else $output_path end),
              output_nar_hash: (if $output_nar_hash == "" then null else $output_nar_hash end),
              error: (if $error_text == "" then null else $error_text end),
              lock_inputs: $lock_inputs,
              run: {
                repository: $repo,
                ref: $ref,
                id: ($run_id | tonumber),
                number: $run_number,
                attempt: ($run_attempt | tonumber)
              }
            }' > out/metadata-linux.json

      - name: Upload Linux metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-linux
          path: out/metadata-linux.json
          if-no-files-found: error

  darwin-eval:
    name: Darwin eval metadata
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v19

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Collect Darwin metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          attr='darwinConfigurations.id-kstuder-MBP-M5-24.system'
          error_file="out/darwin-error.log"
          : > "$error_file"

          lock_inputs_json="$(jq -c '
            .nodes[.root].inputs as $inputs
            | reduce ($inputs | to_entries[]) as $entry ({};
                .[$entry.key] = (
                  .nodes[$entry.value].locked // {}
                  | {
                      type,
                      owner,
                      repo,
                      rev,
                      lastModified,
                      narHash
                    }
                )
              )
          ' flake.lock)"

          status="success"
          drv_path=""
          output_path=""
          error_text=""

          if drv_path="$(nix eval --raw ".#${attr}.drvPath" 2>>"$error_file")"; then
            output_path="$(nix derivation show "$drv_path" | jq -r 'to_entries[0].value.outputs.out.path // empty' 2>>"$error_file" || true)"
          else
            status="failed"
          fi

          if [[ "$status" != "success" ]]; then
            error_text="$(cat "$error_file")"
          fi

          jq -n \
            --arg target "darwin" \
            --arg mode "evaluate" \
            --arg attr "$attr" \
            --arg status "$status" \
            --arg drv_path "$drv_path" \
            --arg output_path "$output_path" \
            --arg error_text "$error_text" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg ref "${GITHUB_REF}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --argjson run_number "${GITHUB_RUN_NUMBER}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --argjson lock_inputs "$lock_inputs_json" \
            '{
              target: $target,
              mode: $mode,
              attr: $attr,
              status: $status,
              drv_path: (if $drv_path == "" then null else $drv_path end),
              output_path: (if $output_path == "" then null else $output_path end),
              output_nar_hash: null,
              error: (if $error_text == "" then null else $error_text end),
              lock_inputs: $lock_inputs,
              run: {
                repository: $repo,
                ref: $ref,
                id: ($run_id | tonumber),
                number: $run_number,
                attempt: ($run_attempt | tonumber)
              }
            }' > out/metadata-darwin.json

      - name: Upload Darwin metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-darwin
          path: out/metadata-darwin.json
          if-no-files-found: error

  observability:
    name: Build diff and summary
    runs-on: ubuntu-latest
    needs:
      - linux-build
      - darwin-eval
    if: always()
    steps:
      - name: Download Linux metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata-linux
          path: current
        continue-on-error: true

      - name: Download Darwin metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata-darwin
          path: current
        continue-on-error: true

      - name: Aggregate current metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p current

          mapfile -t metadata_files < <(find current -maxdepth 1 -type f -name 'metadata-*.json' | sort)
          if [[ "${#metadata_files[@]}" -eq 0 ]]; then
            echo "No metadata files produced by upstream jobs." >&2
            exit 1
          fi

          jq -s '
            {
              generated_at: (now | todate),
              run: (.[0].run // {}),
              targets: (
                reduce .[] as $item ({};
                  .[$item.target] = {
                    mode: $item.mode,
                    attr: $item.attr,
                    status: $item.status,
                    drv_path: $item.drv_path,
                    output_path: $item.output_path,
                    output_nar_hash: $item.output_nar_hash,
                    error: $item.error
                  }
                )
              ),
              lock_inputs: (.[0].lock_inputs // {})
            }
          ' "${metadata_files[@]}" > current/build-metadata.json

      - name: Upload current build metadata
        uses: actions/upload-artifact@v4
        with:
          name: build-metadata
          path: current/build-metadata.json
          if-no-files-found: error

      - name: Find and download previous default-branch metadata
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previous/extracted

          workflow_file="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"
          runs_json="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
            -f branch="${DEFAULT_BRANCH}" \
            -f status="completed" \
            -f per_page=30)"

          previous_run_id="$(echo "${runs_json}" | jq -r --arg current_id "${GITHUB_RUN_ID}" '
            .workflow_runs[]
            | select((.id | tostring) != $current_id and .conclusion == "success")
            | .id
          ' | head -n 1)"

          if [[ -z "${previous_run_id}" || "${previous_run_id}" == "null" ]]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          artifact_url="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${previous_run_id}/artifacts" \
            -f per_page=100 \
            | jq -r '.artifacts[] | select(.name == "build-metadata" and (.expired | not)) | .archive_download_url' \
            | head -n 1)"

          if [[ -z "${artifact_url}" || "${artifact_url}" == "null" ]]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${artifact_url}" \
            -o previous/build-metadata.zip

          unzip -o previous/build-metadata.zip -d previous/extracted >/dev/null

          previous_file="$(find previous/extracted -type f -name 'build-metadata.json' | head -n 1)"
          if [[ -z "${previous_file}" ]]; then
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "found=true" >> "${GITHUB_OUTPUT}"
          echo "run_id=${previous_run_id}" >> "${GITHUB_OUTPUT}"
          echo "file=${previous_file}" >> "${GITHUB_OUTPUT}"

      - name: Build diff JSON
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ steps.previous.outputs.found }}" != "true" ]]; then
            jq -n '
              {
                has_previous: false,
                compared_to_run_id: null,
                has_changes: null,
                note: "No previous successful run on default branch with a build-metadata artifact.",
                target_changes: [],
                lock_input_changes: []
              }
            ' > current/build-diff.json
            exit 0
          fi

          jq -n \
            --slurpfile current current/build-metadata.json \
            --slurpfile previous "${{ steps.previous.outputs.file }}" \
            '
            def target_changed($c; $p; $key):
              (($c.targets[$key].status // null) != ($p.targets[$key].status // null))
              or (($c.targets[$key].drv_path // null) != ($p.targets[$key].drv_path // null))
              or (($c.targets[$key].output_path // null) != ($p.targets[$key].output_path // null))
              or (($c.targets[$key].output_nar_hash // null) != ($p.targets[$key].output_nar_hash // null));

            def lock_changed($c; $p; $key):
              (($c.lock_inputs[$key] // null) != ($p.lock_inputs[$key] // null));

            ($current[0]) as $c
            | ($previous[0]) as $p
            | (
              [((($c.targets // {} | keys_unsorted) + ($p.targets // {} | keys_unsorted)) | unique[]) as $key
               | select(target_changed($c; $p; $key))
               | {
                   target: $key,
                   previous: ($p.targets[$key] // null),
                   current: ($c.targets[$key] // null)
                 }]
            ) as $target_changes
            | (
              [((($c.lock_inputs // {} | keys_unsorted) + ($p.lock_inputs // {} | keys_unsorted)) | unique[]) as $key
               | select(lock_changed($c; $p; $key))
               | {
                   input: $key,
                   previous: ($p.lock_inputs[$key] // null),
                   current: ($c.lock_inputs[$key] // null)
                 }]
            ) as $lock_input_changes
            | {
                has_previous: true,
                compared_to_run_id: ($p.run.id // null),
                has_changes: (($target_changes | length) > 0 or ($lock_input_changes | length) > 0),
                target_changes: $target_changes,
                lock_input_changes: $lock_input_changes
              }
            ' > current/build-diff.json

      - name: Upload build diff
        uses: actions/upload-artifact@v4
        with:
          name: build-diff
          path: current/build-diff.json
          if-no-files-found: error

      - name: Publish summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Nix build observability"
            echo
            if [[ "${{ steps.previous.outputs.found }}" == "true" ]]; then
              echo "Compared to default-branch run: \`${{ steps.previous.outputs.run_id }}\`."
            else
              echo "No previous successful default-branch run artifact was found."
            fi
            echo
            echo "### Target status"
            echo
            jq -r '
              .targets
              | to_entries
              | ["| Target | Mode | Status | Attr |", "|---|---|---|---|"]
                + (map("| \(.key) | \(.value.mode) | \(.value.status) | `\(.value.attr)` |"))
              | .[]
            ' current/build-metadata.json
            echo
            echo "### Diff overview"
            echo
            jq -r '
              if .has_previous == false then
                "- Baseline unavailable."
              else
                "- Target changes: \(.target_changes | length)\n- Lock input changes: \(.lock_input_changes | length)\n- Any change detected: \(.has_changes)"
              end
            ' current/build-diff.json
          } >> "${GITHUB_STEP_SUMMARY}"
